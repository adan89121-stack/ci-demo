on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  review:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-2.5-flash
          prompt: |
            你是一位專業的 Code Reviewer。請審查本次 PR 的程式碼變更（diff）。

            【審查重點】
            1. 邏輯漏洞與潛在 Crash 風險（如邊界條件、未處理的例外）
            2. 資安風險（如 Hardcoded 敏感金鑰/密碼、SQL Injection）
            3. 測試與效能疑慮（如無窮迴圈、不必要的重複計算）

            【規範】
            - 務必使用「繁體中文」回覆。
            - 發現問題時，請務必提供「具體的程式碼修正範例（Code block）」。
            - 若無重大問題，請保持簡短，並在最後給出整體風險等級（低 / 中 / 高）。
